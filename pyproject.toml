[project]
name = "learning-workspace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jagdish", email = "thummarjagdish005@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "datasets>=2.19.0",
    "docling>=2.150.1",
    "docx2txt>=0.9",
    "gensim==4.3.2",
    "ipykernel>=7.4.0",
    "jq>=1.13.0",
    "langchain>=1.5.0",
    "langchain-anthropic>=1.7.10",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-docling>=3.0.0",
    "langchain-google-genai>=4.5.0",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.3",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.8.0",
    "langchain-openrouter>=0.2.9",
    "langchain-pinecone>=0.0.1",
    "langchain-qdrant>=1.1.0",
    "langgraph-checkpoint-postgres>=3.2.1",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mteb>=1.12.5",
    "nltk>=3.10.4",
    "numpy==1.26.4",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "pillow>=10.2.0",
    "pinecone>=10.3.0",
    "pydantic>=2.12.5",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "rank-bm25==0.2.2",
    "scikit-learn==1.4.2",
    "scipy==1.11.4",
    "sentence-transformers==2.7.0",
    "streamlit>=1.67.0",
    "tabulate>=0.10.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "transformers>=4.41.0",
    "unstructured>=0.27.37",
]

[project.scripts]
learning-workspace = "learning_workspace:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cuda"
url = "https://download.pytorch.org/whl/cu132"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cuda" }
torchvision = { index = "pytorch-cuda" }
